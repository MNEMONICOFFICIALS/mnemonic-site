<!DOCTYPE html>

.hero{

}

75%{
transform:translate(-2px,1px);
}

100%{
transform:translate(0);
}

.broadcast{

}

.neighborhood{
height:100vh;

background-image:url("dc.webp");

.member{
height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

cursor:pointer;

background:rgba(255,255,255,0.05);
}

.member:hover{

</head>
